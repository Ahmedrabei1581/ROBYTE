<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Cyber Hex Grid lines -->
  <path d="M 256 40 L 450 150 L 450 362 L 256 472 L 62 362 L 62 150 Z" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <path d="M 256 80 L 410 170 L 410 342 L 256 432 L 102 342 L 102 170 Z" fill="none" stroke="#ffb703" stroke-width="2" stroke-opacity="0.4" />

  <!-- Futuristic Egyptian Cyber Pyramid -->
  <polygon points="256,110 380,350 132,350" fill="url(#bgGrad)" stroke="url(#cyberCyan)" stroke-width="6" filter="url(#glow)" />
  <polygon points="256,110 256,350 380,350" fill="#00f5ff" fill-opacity="0.12" />

  <!-- Eye of Cyber-Horus / AI Core -->
  <ellipse cx="256" cy="270" rx="55" ry="32" fill="none" stroke="url(#neonGold)" stroke-width="5" />
  <circle cx="256" cy="270" r="16" fill="url(#cyberCyan)" filter="url(#glow)" />
  <circle cx="256" cy="270" r="6" fill="#ffffff" />
  <path d="M 256 302 C 265 315, 275 328, 290 335" fill="none" stroke="url(#neonGold)" stroke-width="4" stroke-linecap="round" />
  <path d="M 240 302 L 230 325 L 245 325" fill="none" stroke="url(#neonGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 2027 Tech Text / Nodes -->
  <circle cx="256" cy="110" r="8" fill="#00f5ff" filter="url(#glow)" />
  <circle cx="132" cy="350" r="6" fill="#ffb703" />
  <circle cx="380" cy="350" r="6" fill="#ffb703" />

  <!-- Crosshairs / Cyber Reticle -->
  <line x1="256" y1="210" x2="256" y2="230" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="310" x2="256" y2="330" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="180" y1="270" x2="200" y2="270" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
  <line x1="312" y1="270" x2="332" y2="270" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
</svg>
